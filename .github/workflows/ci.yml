name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # A software Vulkan device, so the GPU parity tests actually run instead
      # of skipping themselves. They are the only thing standing between a
      # correct shader and one that merely looks correct in a screenshot, so
      # letting them silently skip in CI would defeat the point of having them.
      - name: Install a software Vulkan adapter
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Windows runners have no GPU, so the parity tests skip there. Printing
      # the adapter makes that visible in the log rather than leaving it to be
      # assumed either way.
      - name: Report the graphics adapter
        run: cargo test -p frameboost-gpu -- --nocapture
