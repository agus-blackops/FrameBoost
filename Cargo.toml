[workspace]
resolver = "2"
members = [
    "crates/frameboost-core",
    "crates/frameboost-gpu",
    "crates/frameboost-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Set by wgpu 26, the highest floor in the tree. frameboost-core itself has no
# dependencies at all and would build on considerably less, but that has not
# been tested, so this is the number the workspace actually stands behind.
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/agus-blackops/FrameBoost"

[workspace.dependencies]
frameboost-core = { path = "crates/frameboost-core", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
